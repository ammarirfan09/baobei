 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    background: linear-gradient(135deg, #ffd9e8 0%, #ffe8f3 40%, #e8d9ff 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .heart-float {
    position: absolute;
    bottom: -60px;
    font-size: 20px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .terminal {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid #ffc2d9;
    border-radius: 24px;
    padding: clamp(20px, 5vw, 36px);
    width: 100%;
    max-width: min(480px, 92vw);
    max-height: 90dvh;
    overflow-y: auto;
    box-shadow:
      0 20px 60px rgba(255, 143, 187, 0.35),
      0 0 0 6px rgba(255, 255, 255, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    position: relative;
    z-index: 1;
    animation: fadeIn 0.8s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .terminal::-webkit-scrollbar { width: 6px; }
  .terminal::-webkit-scrollbar-thumb {
    background: #ffc2d9;
    border-radius: 3px;
  }

  /* Top decorative row - hearts instead of mac dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: clamp(14px, 3vw, 22px);
  }
  .dot {
    font-size: clamp(12px, 3vw, 16px);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  h2 {
    font-family: 'Dancing Script', cursive;
    color: #ff5c8a;
    font-size: clamp(22px, 6vw, 30px);
    text-align: center;
    margin-bottom: clamp(14px, 3vw, 22px);
    font-weight: 600;
    line-height: 1.3;
  }

  label {
    display: block;
    color: #b56b8a;
    font-size: clamp(12px, 3vw, 13px);
    font-weight: 600;
    margin-bottom: 6px;
    padding-left: 6px;
    letter-spacing: 0.3px;
  }

  input {
    width: 100%;
    padding: clamp(12px, 3vw, 14px) clamp(14px, 3vw, 16px);
    background: #fff5f9;
    border: 2px solid #ffd9e8;
    border-radius: 14px;
    color: #7a4a63;
    font-family: inherit;
    font-size: clamp(13px, 3vw, 14px);
    font-weight: 500;
    margin-bottom: clamp(12px, 3vw, 16px);
    outline: none;
    transition: all 0.25s ease;
  }
  input::placeholder {
    color: #d3a5b8;
    font-weight: 400;
  }
  input:focus {
    border-color: #ff8fb8;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 143, 184, 0.15);
    transform: translateY(-1px);
  }

  button {
    width: 100%;
    padding: clamp(12px, 3vw, 14px);
    background: linear-gradient(135deg, #ff8fb8 0%, #ff5c8a 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: clamp(14px, 3.2vw, 15px);
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 92, 138, 0.35);
    transition: all 0.25s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(255, 92, 138, 0.45);
  }
  button:active {
    transform: translateY(0) scale(0.98);
    box-shadow: 0 4px 12px rgba(255, 92, 138, 0.35);
  }

  /* WRONG PASSWORD MESSAGE */
  .error {
    display: none;
    margin-top: clamp(14px, 3vw, 18px);
    padding: clamp(14px, 3.5vw, 18px);
    background: linear-gradient(135deg, #fff0f5 0%, #ffe8f0 100%);
    border: 2px dashed #ff9ec0;
    border-radius: 16px;
    color: #e04b7c;
    font-size: clamp(13px, 3vw, 14px);
    font-weight: 600;
    line-height: 1.6;
    text-align: center;
    word-break: break-word;
  }
  .error .hint {
    display: block;
    margin-top: 8px;
    color: #b56b8a;
    font-family: 'Dancing Script', cursive;
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 600;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-6px) rotate(-0.5deg); }
    80% { transform: translateX(6px) rotate(0.5deg); }
  }

  /* WISH SCREEN */
  .wish {
    display: none;
    color: #7a4a63;
    font-size: clamp(13px, 3.2vw, 15px);
    font-weight: 500;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .wish .cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: #ff5c8a;
    animation: blink 1s infinite;
    vertical-align: middle;
    margin-left: 2px;
    border-radius: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Big heart burst on success */
  .burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .burst span {
    position: absolute;
    font-size: 40px;
    animation: burstOut 1.2s ease-out forwards;
  }
  @keyframes burstOut {
    0%   { transform: translate(0,0) scale(0); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
  }

  @media (max-width: 380px) {
    .terminal { padding: 18px; border-radius: 20px; }
  }
  @media (max-height: 500px) {
    body { align-items: flex-start; padding: 10px; }
    .terminal { max-height: 96dvh; padding: 16px; }
  }

  /* Respect users who dislike motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

  // floating hearts
  const heartEmojis = ['💕','💖','💗','💓','🌸','✨','💝'];
  const heartsContainer = document.getElementById('hearts');

  function heartBurst() {
    const burst = document.getElementById('burst');
    burst.style.display = 'flex';

      s.style.animationDelay = (Math.random() * 0.2) + 's';
      burst.appendChild(s);
    }
    setTimeout(() => {
      burst.style.display = 'none';
      burst.innerHTML = '';
    }, 1500);
  }
